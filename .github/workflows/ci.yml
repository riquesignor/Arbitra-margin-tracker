name: CI

# Roda em todo push/PR contra main — pega typecheck/teste/build quebrado
# antes de chegar em produção (ver docs/architecture-review.md > Qualidade).
# Não precisa de nenhum secret: typecheck e build não fazem chamada de
# rede/API em build-time (Firebase é lazy-loaded em runtime, ver
# src/lib/firebase.ts), e os testes cobrem só módulos puros.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Typecheck (frontend + api)
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build
